<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Car Rental System</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, sans-serif;
}

body {
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	background: linear-gradient(135deg, #1e3c72, #2a5298);
}

.login-container {
	width: 400px;
	padding: 40px;
	background-color: white;
	border-radius: 15px;
	box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
	text-align: center;
}

.login-container h1 {
	color: #1e3c72;
	margin-bottom: 10px;
}

.login-container p {
	color: gray;
	margin-bottom: 30px;
}

.input-group {
	text-align: left;
	margin-bottom: 20px;
}

.input-group label {
	display: block;
	margin-bottom: 8px;
	font-weight: bold;
	color: #333;
}

.input-group input {
	width: 100%;
	padding: 13px;
	border: 1px solid #ccc;
	border-radius: 8px;
	font-size: 16px;
	outline: none;
}

.input-group input:focus {
	border-color: #1e3c72;
}

.login-btn {
	width: 100%;
	padding: 14px;
	background-color: #1e3c72;
	color: white;
	border: none;
	border-radius: 8px;
	font-size: 17px;
	font-weight: bold;
	cursor: pointer;
	transition: 0.3s;
}

.login-btn:hover {
	background-color: #2a5298;
	transform: translateY(-2px);
}

.back-link {
	display: block;
	margin-top: 20px;
	text-decoration: none;
	color: #1e3c72;
	font-weight: bold;
}

.back-link:hover {
	text-decoration: underline;
}
</style>

</head>

<body>

	<div class="login-container">

		<h1>👨‍💼 Admin Login</h1>

		<p>Login to manage the Car Rental System</p>

		<form action="adminlogin" method="get">

			<div class="input-group">

				<label>Username</label> <input type="text" name="username"
					placeholder="Enter username" required>

			</div>


			<div class="input-group">

				<label>Password</label> <input type="password" name="password"
					placeholder="Enter password" required>

			</div>

			<button type="submit" class="login-btn">Login</button>

		</form>


		<a href="car1home.html" class="back-link"> ← Back to Home </a>

	</div>

</body>

</html>
