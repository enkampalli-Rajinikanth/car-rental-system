<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register Car - Car Rental System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1d2671, #c33764);
            padding: 30px;
        }

        .container {
            width: 600px;
            max-width: 100%;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1d2671;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d2671;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #1d2671;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c33764;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #1d2671;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚗 Register Car</h1>

    <p class="subtitle">
        Enter the car details to register it
    </p>

    <form action="cardata" method="get">

        <div class="form-group">
            <label>Car Name</label>

            <input type="text"
                   name="carname"
                   placeholder="Example: Swift"
                   required>
        </div>


        <div class="form-group">
            <label>Car Number</label>

            <input type="text"
                   name="carnumber"
                   placeholder="Example: TS09AB1234"
                   required>
        </div>


        <div class="form-group">
            <label>Seating Capacity</label>

            <input type="number"
                   name="seats"
                   placeholder="Example: 5"
                   min="1"
                   required>
        </div>


        <div class="form-group">
            <label>Price Per Day (₹)</label>

            <input type="number"
                   name="price"
                   placeholder="Example: 2000"
                   min="1"
                   required>
        </div>


        <div class="form-group">
            <label>Availability</label>

            <select name="availability" required>
                <option value="Available">Available</option>
                <option value="Not Available">Not Available</option>
            </select>
        </div>


        <button type="submit">
            🚗 Register Car
        </button>

    </form>

    <a href="Adminhome.html" class="back">
        ← Back to Admin Dashboard
    </a>

</div>

</body>
</html>
