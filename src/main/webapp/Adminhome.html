<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Car Rental System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .logout {
            text-decoration: none;
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .logout:hover {
            background-color: #c0392b;
        }

        /* Welcome Section */
        .welcome {
            text-align: center;
            color: white;
            margin-top: 50px;
        }

        .welcome h2 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 18px;
        }

        /* Cards */
        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 60px;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 30px 20px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            color: #777;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #1d2671;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #c33764;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>🚗 Car Rental System</h1>

        <a href="index.jsp" class="logout">Logout</a>
    </div>


    <!-- Welcome -->
    <div class="welcome">
        <h2>Welcome, Rajinikanth 👋</h2>
        <p>Manage your cars and rental system easily.</p>
    </div>


    <!-- Dashboard Cards -->
    <div class="container">

        <!-- Register Car -->
        <div class="card">
            <div class="icon">🚘</div>

            <h3>Register Car</h3>

            <p>Add a new car to the rental system.</p>

            <a href="registercar.html" class="btn">
                Register Car
            </a>
        </div>


        <!-- View Cars -->
        <div class="card">
            <div class="icon">📋</div>

            <h3>View Cars</h3>

            <p>View all registered cars.</p>

            <a href="viewcars" class="btn">
                View Cars
            </a>
        </div>


        <!-- Delete Car -->
        <div class="card">
            <div class="icon">🗑️</div>

            <h3>Delete Car</h3>

            <p>Remove a car from the system.</p>

            <a href="deletecar.html" class="btn">
                Delete Car
            </a>
        </div>

    </div>

</body>
</html>
