<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Registration</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    text-align: center;
}

.register-container {
    width: 350px;
    margin: 100px auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border: 1px solid gray;
    border-radius: 5px;
}

button {
    width: 95%;
    padding: 12px;
    margin-top: 15px;
    font-size: 16px;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="register-container">

    <h1>Customer Registration</h1>

    <form action="customerdata" method="get">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>

        <input type="tel"
               name="mobile"
               placeholder="Enter Mobile Number"
               required>

        <input type="password"
               name="password"
               placeholder="Create Password"
               required>

        <br>

        <button type="submit">Register</button>

    </form>

    <br>

    <a href="Customerlogin.html">Already have an account? Login</a>
    
    

</div>

</body>
</html>
